<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Google Drive</title> <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">

        body { margin: 0; background: #111; font-family: sans-serif; overflow: hidden; }

<div id="navbar">
    <button onclick="launch('https://tiktok.com')">TikTok</button>

<iframe id="game-container" src=""></iframe>

<script>
    function launch(url) {
        document.getElementById('game-container').src = url;
    }
</script>

</html>
