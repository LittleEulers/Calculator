<button onclick="launchProxy('https://tiktok.com')">Launch TikTok</button>

<iframe id="game-container" style="width:100%; height:90vh; border:none; margin-top:10px;"></iframe>

<script>
    // Tab Cloaking (This part is perfect)
    document.title = "My Drive";
    var link = document.querySelector("link[rel~='icon']");
    if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.getElementsByTagName('head')[0].appendChild(link);
    }
    link.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png'; 

    function launchProxy(target) {
        // Updated proxyBase: Most UV proxies need the '/service/' or '/main/' suffix
        const proxyBase = 'https://nomorelinewize.promathclass.com/service/hvtrs88%2F%2F'; 
        const frame = document.getElementById('game-container');
        
        // Note: Some proxies encode the URL. 
        // If 'https://tiktok.com' doesn't work, try just 'www.tiktok.com'
        frame.src = proxyBase + btoa(target).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, ''); 
        
        // Simpler version if the proxy doesn't require encoding:
        // frame.src = 'https://nomorelinewize.promathclass.com/main/' + target;
    }
</script>
